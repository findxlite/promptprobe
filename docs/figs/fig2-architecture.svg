<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" width="980" height="640" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="980" height="640" fill="#ffffff"/>
  <!-- 展示层 -->
  <rect x="24" y="56" width="932" height="104" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="38" y="76" font-size="13" font-weight="600" fill="#334155">展示层　单页 Web（原生 JS，无构建步骤）</text>
  <rect x="44" y="88" width="168" height="52" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="128" y="110" font-size="13" text-anchor="middle" fill="#0f172a">受测应用选择</text>
  <text x="128" y="126" font-size="11.5" text-anchor="middle" fill="#64748b">system prompt 可视化</text>
  <rect x="228" y="88" width="168" height="52" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="312" y="110" font-size="13" text-anchor="middle" fill="#0f172a">扫描进度与实时判定</text>
  <text x="312" y="126" font-size="11.5" text-anchor="middle" fill="#64748b">轮询 500ms</text>
  <rect x="412" y="88" width="168" height="52" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="496" y="110" font-size="13" text-anchor="middle" fill="#0f172a">评分卡与用例详情</text>
  <text x="496" y="126" font-size="11.5" text-anchor="middle" fill="#64748b">攻击载荷 / 回复 / 证据</text>
  <rect x="596" y="88" width="168" height="52" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="680" y="110" font-size="13" text-anchor="middle" fill="#0f172a">加固方案与前后对比</text>
  <text x="680" y="126" font-size="11.5" text-anchor="middle" fill="#64748b">同 seed 复测</text>
  <rect x="780" y="88" width="156" height="52" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="858" y="110" font-size="13" text-anchor="middle" fill="#0f172a">报告导出</text>
  <text x="858" y="126" font-size="11.5" text-anchor="middle" fill="#64748b">Markdown</text>

  <line x1="490" y1="160" x2="490" y2="186" stroke="#475569" stroke-width="1.4" marker-end="url(#a2)"/>
  <text x="502" y="178" font-size="11.5" fill="#64748b">REST / JSON</text>

  <!-- 接口层 -->
  <rect x="24" y="188" width="932" height="72" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="38" y="208" font-size="13" font-weight="600" fill="#3730a3">接口层　HTTP 服务（Node.js 原生 http，零第三方依赖）</text>
  <g font-size="12.5" fill="#312e81" font-family="Consolas, monospace">
    <text x="44" y="238">POST /api/scan</text>
    <text x="176" y="238">GET /api/jobs/:id</text>
    <text x="316" y="238">POST /api/jobs/:id/harden</text>
    <text x="520" y="238">POST /api/jobs/:id/rescan</text>
    <text x="712" y="238">GET /api/jobs/:id/report</text>
  </g>

  <line x1="490" y1="260" x2="490" y2="286" stroke="#475569" stroke-width="1.4" marker-end="url(#a2)"/>

  <!-- 引擎层 -->
  <rect x="24" y="288" width="932" height="150" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="38" y="308" font-size="13" font-weight="600" fill="#334155">引擎层　红队引擎（核心创新点集中在判定层）</text>

  <rect x="44" y="320" width="160" height="100" rx="8" fill="#ffffff" stroke="#6366f1"/>
  <text x="124" y="342" font-size="13" text-anchor="middle" fill="#312e81" font-weight="600">① 用例生成</text>
  <text x="124" y="360" font-size="11.5" text-anchor="middle" fill="#475569">16 条威胁模板</text>
  <text x="124" y="376" font-size="11.5" text-anchor="middle" fill="#475569">× 7 种变异算子</text>
  <text x="124" y="392" font-size="11.5" text-anchor="middle" fill="#475569">seed 决定用例集</text>
  <text x="124" y="408" font-size="11.5" text-anchor="middle" fill="#475569">+ 4 条正常对照</text>

  <rect x="222" y="320" width="150" height="100" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="297" y="342" font-size="13" text-anchor="middle" fill="#0f172a" font-weight="600">② 投递执行</text>
  <text x="297" y="360" font-size="11.5" text-anchor="middle" fill="#475569">并发池（3）</text>
  <text x="297" y="376" font-size="11.5" text-anchor="middle" fill="#475569">system + attack</text>
  <text x="297" y="392" font-size="11.5" text-anchor="middle" fill="#475569">温度 0.7 · 500 tokens</text>
  <text x="297" y="408" font-size="11.5" text-anchor="middle" fill="#475569">失败重试与超时</text>

  <rect x="390" y="320" width="230" height="100" rx="8" fill="#fff7ed" stroke="#fb923c"/>
  <text x="505" y="342" font-size="13" text-anchor="middle" fill="#9a3412" font-weight="600">③ 双层判定</text>
  <text x="505" y="360" font-size="11.5" text-anchor="middle" fill="#7c2d12">规则层：金丝雀 / LCS / n-gram / 拒答</text>
  <text x="505" y="376" font-size="11.5" text-anchor="middle" fill="#7c2d12">语义层：裁判模型复核 uncertain</text>
  <text x="505" y="392" font-size="11.5" text-anchor="middle" fill="#7c2d12">证据链留痕 + 交叉校验标记</text>
  <text x="505" y="408" font-size="11.5" text-anchor="middle" fill="#7c2d12">误报控制：拒答优先于敏感词</text>

  <rect x="638" y="320" width="150" height="100" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="713" y="342" font-size="13" text-anchor="middle" fill="#0f172a" font-weight="600">④ 评分聚合</text>
  <text x="713" y="360" font-size="11.5" text-anchor="middle" fill="#475569">分类 ASR / 加权 ASR</text>
  <text x="713" y="376" font-size="11.5" text-anchor="middle" fill="#475569">评分 = 100×(1−加权ASR)</text>
  <text x="713" y="392" font-size="11.5" text-anchor="middle" fill="#475569">误报率 / 判定器 P·R·F1</text>
  <text x="713" y="408" font-size="11.5" text-anchor="middle" fill="#475569">p50 时延</text>

  <rect x="806" y="320" width="130" height="100" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="871" y="342" font-size="13" text-anchor="middle" fill="#0f172a" font-weight="600">⑤ 加固与复测</text>
  <text x="871" y="360" font-size="11.5" text-anchor="middle" fill="#475569">7 条安全边界</text>
  <text x="871" y="376" font-size="11.5" text-anchor="middle" fill="#475569">按命中项定向补强</text>
  <text x="871" y="392" font-size="11.5" text-anchor="middle" fill="#475569">同 seed 复测</text>
  <text x="871" y="408" font-size="11.5" text-anchor="middle" fill="#475569">前后对比表/图</text>

  <path d="M204,370 L219,370" stroke="#475569" stroke-width="1.3" marker-end="url(#a2)"/>
  <path d="M372,370 L387,370" stroke="#475569" stroke-width="1.3" marker-end="url(#a2)"/>
  <path d="M620,370 L635,370" stroke="#475569" stroke-width="1.3" marker-end="url(#a2)"/>
  <path d="M788,370 L803,370" stroke="#475569" stroke-width="1.3" marker-end="url(#a2)"/>

  <line x1="490" y1="438" x2="490" y2="466" stroke="#475569" stroke-width="1.4" marker-end="url(#a2)"/>

  <!-- 模型层 -->
  <rect x="24" y="468" width="580" height="104" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="38" y="488" font-size="13" font-weight="600" fill="#334155">模型层　LLM 提供方抽象（统一 OpenAI 兼容协议）</text>
  <rect x="44" y="500" width="170" height="56" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="129" y="521" font-size="13" text-anchor="middle" fill="#0f172a">云端 API</text>
  <text x="129" y="538" font-size="11.5" text-anchor="middle" fill="#64748b">DeepSeek / Qwen / GLM</text>
  <rect x="228" y="500" width="170" height="56" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="313" y="521" font-size="13" text-anchor="middle" fill="#0f172a">本地 ollama</text>
  <text x="313" y="538" font-size="11.5" text-anchor="middle" fill="#64748b">qwen2.5 / llama3</text>
  <rect x="412" y="500" width="176" height="56" rx="8" fill="#fffbeb" stroke="#fbbf24"/>
  <text x="500" y="521" font-size="13" text-anchor="middle" fill="#78350f">离线模拟器</text>
  <text x="500" y="538" font-size="11.5" text-anchor="middle" fill="#92400e">无 Key 时兜底，标注 SIMULATED</text>

  <!-- 数据层 -->
  <rect x="620" y="468" width="336" height="104" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="634" y="488" font-size="13" font-weight="600" fill="#334155">数据层</text>
  <text x="634" y="510" font-size="12" fill="#475569">profiles.json：受测应用档案 + 金丝雀</text>
  <text x="634" y="530" font-size="12" fill="#475569">攻击用例库：模板 × 变异算子</text>
  <text x="634" y="550" font-size="12" fill="#475569">内存态任务（Job）+ Markdown 报告</text>

  <line x1="490" y1="468" x2="490" y2="446" stroke="#475569" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="24" y="606" font-size="12" fill="#64748b">说明：引擎层与模型层解耦，同一套用例可在"真实模型"与"离线模拟器"之间切换；</text>
  </svg>
